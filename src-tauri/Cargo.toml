[package]
name = "pdfx"
version = "0.1.0"
description = "PDFX — a local-first PDF editor"
authors = ["PDFX contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pdfx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
# pdfium-render defaults pull in the `image` crate for PdfBitmap::as_image, which
# PDFX does not use; only the bindings and the thread-safe wrapper are needed.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
percent-encoding = "2"
png = "0.18"
# Glyph coverage checks before rewriting text with an embedded font.
ttf-parser = "0.25"

[features]
default = []
# Used by production builds so the frontend is embedded instead of loaded from devUrl.
custom-protocol = ["tauri/custom-protocol"]

# PDFX vendors pdfium-render 0.9.4 with a minimal patch adding flags-aware saves
# and the annotation capabilities PDFium supports but the crate does not expose.
# See src-tauri/vendor/pdfium-render/PDFX-PATCH.md for the patch scope, its
# verification and the upgrade procedure.
[patch.crates-io]
pdfium-render = { path = "vendor/pdfium-render" }
