[package]
name = "pdfx"
version = "0.1.0"
description = "PDFX — a local-first PDF editor"
authors = ["PDFX contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pdfx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Used by production builds so the frontend is embedded instead of loaded from devUrl.
custom-protocol = ["tauri/custom-protocol"]
