name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Windows packaging configuration
        run: node scripts/verify-windows-config.mjs
      - name: Frontend tests
        run: npm test -- --maxWorkers=2 --testTimeout=15000
      - name: Set up PDFium
        run: '& "$env:ProgramFiles/Git/bin/bash.exe" scripts/setup-native.sh'
      - name: Native tests on Windows
        run: cargo test --locked --no-fail-fast --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installers and portable package
        run: ./scripts/build-windows.ps1 -SkipNativeSetup
      - name: Collect distribution files
        run: |
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          New-Item -ItemType Directory -Path release/windows -Force | Out-Null
          Copy-Item "$bundle/nsis/*-setup.exe" release/windows/
          Copy-Item "$bundle/msi/*.msi" release/windows/
          Copy-Item "$bundle/portable/*-portable.zip" release/windows/
          Copy-Item "$bundle/SHA256SUMS-windows.txt" release/windows/
          Copy-Item docs/install-windows.md release/windows/INSTALL-windows.md
          "Source commit: $env:GITHUB_SHA`nBuild: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`nArchitecture: Windows x64`nSignature: unsigned" | Set-Content release/windows/BUILD-INFO.txt
      - name: Upload Windows distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDFX-windows-x64
          path: release/windows/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
