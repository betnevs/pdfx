name: Prepare Windows installer download

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows build run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download existing Windows build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PDFX-windows-x64
          path: distribution
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and select installer
        working-directory: distribution
        run: |
          sha256sum -c SHA256SUMS-windows.txt
          mkdir ../installer
          cp ./*-setup.exe BUILD-INFO.txt INSTALL-windows.md ../installer/
          cd ../installer
          sha256sum ./*-setup.exe > SHA256SUMS-windows.txt
      - name: Upload installer only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDFX-windows-installer
          path: installer/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
